name: Deploy to Infomaniak

on:
  push:
    branches:
      - main
  workflow_dispatch:        # permet de relancer un deploiement sans commit

jobs:
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # FTP-Deploy-Action ne tenait pas : la session tombait apres 1 a 3
      # fichiers, quelle que soit la taille du lot ou le timeout, et l'action
      # abandonne des la premiere coupure. lftp reconnecte tout seul et
      # reprend le miroir la ou il s'est arrete.
      #
      # --ignore-time : git checkout remet toutes les dates a l'heure du run,
      # donc la comparaison se fait sur la taille, sinon tout serait renvoye
      # a chaque deploiement.
      # Pas de --delete : les anciens fichiers restent en place plutot que de
      # risquer d'effacer quelque chose qui ne vient pas du depot.
      # Les pages passent d'abord, et chacune est envoyee sous un nom
      # temporaire puis renommee. Une session coupee en pleine ecriture avait
      # fait disparaitre index.html du serveur : la home renvoyait un listing
      # de repertoire. Avec le renommage, l'ancienne page reste en place
      # jusqu'a ce que la nouvelle soit entierement transferee.
      - name: Deploy HTML pages (atomique)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # put + mv laissait index.html absent sans remonter d'erreur, alors
          # que mirror a deja cree des fichiers a la racine sans probleme :
          # les pages passent donc par mirror, restreint au HTML.
          pages_once() {
            lftp -c "
              set cmd:fail-exit yes;
              set net:max-retries 100;
              set net:reconnect-interval-base 3;
              set net:reconnect-interval-multiplier 1;
              set net:timeout 20;
              set ftp:ssl-allow no;
              set ftp:passive-mode on;
              set mirror:parallel-transfer-count 1;
              set xfer:clobber on;
              set ftp:rest-stor yes;
              open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER';
              mirror -R --continue --verbose=1 --ignore-time --no-perms \
                --include-glob '*/' \
                --include-glob '*.html' \
                --exclude-glob '.git*' \
                --exclude-glob 'node_modules/' \
                --exclude-glob 'src/' \
                --exclude-glob '.claude/' \
                ./ /;
            "
          }
          for attempt in $(seq 1 15); do
            echo "::group::pages - passe $attempt"
            if pages_once; then
              echo "::endgroup::"
              echo "pages en ligne (passe $attempt)"
              break
            fi
            echo "::endgroup::"
            echo "passe $attempt interrompue, reprise"
            sleep 5
          done

      # La home est la page critique : si elle manque, Apache sert un listing
      # de repertoire. On le verifie avant d'aller plus loin.
      - name: Verifier la home tout de suite
        run: |
          body=$(curl -s https://digitme.fun/)
          if printf '%s' "$body" | grep -q 'Index of /'; then
            echo "ECHEC: la racine sert un listing de repertoire, index.html manque"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q 'rel="canonical"'; then
            echo "ECHEC: la home ne contient pas la nouvelle version"
            exit 1
          fi
          echo "home a jour"

      - name: Deploy assets via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Le serveur coupe la session toutes les quelques fichiers. lftp
          # reconnecte, mais finit par epuiser son budget de reconnexions :
          # on le relance donc plusieurs fois, chaque passe ne reprenant que
          # ce qui manque encore (comparaison sur la taille).
          mirror_once() {
            lftp -c "
              set cmd:fail-exit yes;
              set net:max-retries 100;
              set net:reconnect-interval-base 3;
              set net:reconnect-interval-multiplier 1;
              set net:timeout 20;
              set ftp:ssl-allow no;
              set ftp:passive-mode on;
              set mirror:parallel-transfer-count 1;
              set xfer:clobber on;
              set ftp:rest-stor yes;
              open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER';
              mirror -R --continue --verbose=1 --ignore-time --no-perms \
                --exclude-glob '.git*' \
                --exclude-glob 'node_modules/' \
                --exclude-glob 'src/' \
                --exclude-glob '.claude/' \
                --exclude-glob 'package*.json' \
                --exclude-glob 'tailwind.config.js' \
                --exclude-glob 'CNAME' \
                --exclude-glob '*.html' \
                ./ /;
            "
          }
          for attempt in $(seq 1 30); do
            echo "::group::miroir - passe $attempt"
            if mirror_once; then
              echo "::endgroup::"
              echo "miroir complet a la passe $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "passe $attempt interrompue par le serveur, reprise"
            sleep 5
          done
          echo "30 passes n'ont pas suffi a terminer le miroir"
          exit 1

      - name: Verifier le site en ligne
        run: |
          fail=0

          # Les pages : /index.html est redirige vers / par .htaccess, on teste
          # donc les URLs reelles.
          for u in / /fr/ /404.html /colorsnap/ /lilou/ /avant-apres/ /friendping/ /reversegame/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://digitme.fun$u")
            printf 'page   %-34s %s\n' "$u" "$code"
            [ "$code" = "200" ] || fail=1
          done

          # La home doit servir la vraie page, pas un listing de repertoire.
          if curl -s https://digitme.fun/ | grep -q 'rel="canonical"'; then
            echo 'page   /                                  contenu a jour'
          else
            echo 'page   /                                  CONTENU MANQUANT OU OBSOLETE'
            fail=1
          fi

          for f in css/tailwind.css css/fonts.css css/aos.css js/main.js js/aos.js \
                   robots.txt sitemap.xml site.webmanifest favicon.svg \
                   fonts/inter-400-latin.woff2 fonts/inter-900-latin.woff2 \
                   images/og-en.jpg images/og-default.jpg images/friendping_logo.webp \
                   lilou/home.webp colorsnap/screen-result.webp shapesnap/logo.webp; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://digitme.fun/$f")
            printf 'asset  %-34s %s\n' "$f" "$code"
            [ "$code" = "200" ] || fail=1
          done

          exit $fail
