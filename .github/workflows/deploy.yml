name: Deploy to Infomaniak

on:
  push:
    branches:
      - main
  workflow_dispatch:        # permet de relancer un deploiement sans commit

jobs:
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # FTP-Deploy-Action ne tenait pas : la session tombait apres 1 a 3
      # fichiers, quelle que soit la taille du lot ou le timeout, et l'action
      # abandonne des la premiere coupure. lftp reconnecte tout seul et
      # reprend le miroir la ou il s'est arrete.
      #
      # --ignore-time : git checkout remet toutes les dates a l'heure du run,
      # donc la comparaison se fait sur la taille, sinon tout serait renvoye
      # a chaque deploiement.
      # Pas de --delete : les anciens fichiers restent en place plutot que de
      # risquer d'effacer quelque chose qui ne vient pas du depot.
      - name: Deploy via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Le serveur coupe la session toutes les quelques fichiers. lftp
          # reconnecte, mais finit par epuiser son budget de reconnexions :
          # on le relance donc plusieurs fois, chaque passe ne reprenant que
          # ce qui manque encore (comparaison sur la taille).
          mirror_once() {
            lftp -c "
              set cmd:fail-exit yes;
              set net:max-retries 100;
              set net:reconnect-interval-base 3;
              set net:reconnect-interval-multiplier 1;
              set net:timeout 20;
              set ftp:ssl-allow no;
              set ftp:passive-mode on;
              set mirror:parallel-transfer-count 1;
              set xfer:clobber on;
              open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER';
              mirror -R --verbose=1 --ignore-time --no-perms \
                --exclude-glob '.git*' \
                --exclude-glob 'node_modules/' \
                --exclude-glob 'src/' \
                --exclude-glob '.claude/' \
                --exclude-glob 'package*.json' \
                --exclude-glob 'tailwind.config.js' \
                --exclude-glob 'CNAME' \
                ./ /;
            "
          }
          for attempt in $(seq 1 30); do
            echo "::group::miroir - passe $attempt"
            if mirror_once; then
              echo "::endgroup::"
              echo "miroir complet a la passe $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "passe $attempt interrompue par le serveur, reprise"
            sleep 5
          done
          echo "30 passes n'ont pas suffi a terminer le miroir"
          exit 1

      - name: Verifier quelques fichiers en ligne
        run: |
          fail=0
          for f in index.html css/tailwind.css css/fonts.css js/main.js robots.txt sitemap.xml \
                   site.webmanifest fonts/inter-400-latin.woff2 images/og-en.jpg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://digitme.fun/$f")
            printf '%-40s %s\n' "$f" "$code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
